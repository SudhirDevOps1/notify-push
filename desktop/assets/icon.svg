<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="128" height="128">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="108" height="108" rx="24" fill="url(#iconBg)" />
  <rect width="108" height="108" rx="24" fill="none" stroke="#4338CA" stroke-width="1.5" opacity="0.6" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="54" cy="54" r="40" fill="url(#iconGlow)" />

  <!-- Left Broadcast Waves -->
  <path d="M 36,44 A 20,20 0 0,0 36,66" fill="none" stroke="#818CF8" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 30,38 A 28,28 0 0,0 30,72" fill="none" stroke="#A5B4FC" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

  <!-- Right Broadcast Waves -->
  <path d="M 72,44 A 20,20 0 0,1 72,66" fill="none" stroke="#818CF8" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 78,38 A 28,28 0 0,1 78,72" fill="none" stroke="#A5B4FC" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

  <!-- Bell Body -->
  <path d="M 54,34 C 52.34,34 51,35.34 51,37 L 51,38.1 C 46.4,39.6 43,43.9 43,49 L 43,62 L 39,66 L 39,68 L 69,68 L 69,66 L 65,62 L 65,49 C 65,43.9 61.6,39.6 57,38.1 L 57,37 C 57,35.34 55.66,34 54,34 Z" fill="#FFFFFF" />

  <!-- Bell Clapper -->
  <path d="M 54,73 C 56.2,73 58,71.2 58,69 L 50,69 C 50,71.2 51.8,73 54,73 Z" fill="#E0E7FF" />

  <!-- Active Pulse Badge at top-right of bell -->
  <circle cx="68.5" cy="38" r="4.5" fill="#38BDF8" filter="url(#badgeGlow)" />
  <circle cx="68.5" cy="38" r="2" fill="#FFFFFF" />
</svg>
