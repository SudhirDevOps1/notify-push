name: Release & Publish SDKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      npm_tag:
        description: 'NPM distribution tag (e.g. latest, beta, next)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/NotifyPush-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifypush-apk
          path: release-artifacts/NotifyPush-debug.apk
          if-no-files-found: error

  publish-npm:
    name: Publish TypeScript SDK to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Sync package version with tag
        working-directory: sdk/typescript
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Setting package version to $TAG_VERSION from tag ${{ github.ref_name }}"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: Run TypeScript SDK Tests
        working-directory: sdk/typescript
        run: npm test

      - name: Publish to NPM Registry
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=NPM_TOKEN Missing::NPM_TOKEN secret is not set in Repository Secrets. Skipping npm publish. Add NPM_TOKEN in GitHub Settings > Secrets and variables > Actions."
            echo "Skipping NPM publish because secrets.NPM_TOKEN is empty."
          else
            echo "Publishing notifypush-client to NPM registry with tag: $NPM_TAG..."
            OUTPUT=$(npm publish --access public --tag "$NPM_TAG" 2>&1) && echo "$OUTPUT" || {
              EXIT_CODE=$?
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -q "previously published versions"; then
                echo "::notice title=NPM Already Published::Version is already published on NPM. Continuing release pipeline."
              else
                exit $EXIT_CODE
              fi
            }
            echo "Successfully handled NPM publish step!"
          fi

  create-github-release:
    name: Create GitHub Release
    needs: [build-android, publish-npm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: notifypush-apk
          path: release-artifacts

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          files: release-artifacts/NotifyPush-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
