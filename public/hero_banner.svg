<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="260" cy="210" r="140" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />
  <circle cx="940" cy="180" r="120" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />

  <!-- Left Icon Art (Bell with Ringing Pulse) -->
  <g transform="translate(130, 90)">
    <!-- Pulse Wave 1 -->
    <path d="M 120 40 A 100 100 0 0 1 200 120" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.6" stroke-dasharray="6,6" />
    <!-- Pulse Wave 2 -->
    <path d="M 135 20 A 130 130 0 0 1 235 120" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Bell Outer Shape -->
    <path d="M 80 40 C 80 26 69 16 55 16 C 41 16 30 26 30 40 C 30 80 12 110 5 125 C 2 131 7 138 14 138 L 96 138 C 103 138 108 131 105 125 C 98 110 80 80 80 40 Z"
          fill="url(#bellGrad)" filter="url(#glow)" opacity="0.95" />
    <!-- Bell Top Ring -->
    <circle cx="55" cy="14" r="8" fill="none" stroke="#FCD34D" stroke-width="4" />
    <!-- Bell Clapper -->
    <path d="M 43 144 C 43 151 48 156 55 156 C 62 156 67 151 67 144 Z" fill="#D97706" />
    <!-- Notification Badge -->
    <circle cx="92" cy="38" r="18" fill="#EF4444" />
    <text x="92" y="44" fill="#FFFFFF" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Central Title & Brand -->
  <g transform="translate(380, 150)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="#FFFFFF">
      Notify<tspan fill="url(#textGrad)">Push</tspan>
    </text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#9CA3AF" letter-spacing="0.2">
      Self-Hosted, Privacy-First Push Notification Gateway &amp; Android Client
    </text>
    
    <!-- Badges Row -->
    <g transform="translate(0, 75)">
      <!-- Badge 1: Zero Telemetry -->
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10B981" />
      <text x="30" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Zero Telemetry</text>

      <!-- Badge 2: Latency -->
      <rect x="150" y="0" width="135" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="166" cy="16" r="5" fill="#06B6D4" />
      <text x="180" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">&lt; 500ms Push</text>

      <!-- Badge 3: No FCM / Local -->
      <rect x="295" y="0" width="140" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="311" cy="16" r="5" fill="#8B5CF6" />
      <text x="325" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">No Firebase Lock</text>

      <!-- Badge 4: Open Source -->
      <rect x="445" y="0" width="125" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="461" cy="16" r="5" fill="#F59E0B" />
      <text x="475" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MIT Open Source</text>
    </g>

    <!-- Supported Languages -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" font-family="monospace" font-size="13" fill="#64748B">
        SDKs: <tspan fill="#38BDF8">TypeScript</tspan> • <tspan fill="#34D399">Python</tspan> • <tspan fill="#A78BFA">PHP</tspan> • <tspan fill="#60A5FA">Go</tspan> • <tspan fill="#FBBF24">cURL / Shell</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side Decorative Code Snippet Card -->
  <g transform="translate(900, 70)">
    <rect width="260" height="270" rx="12" fill="#030712" stroke="#1F2937" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="36" cy="20" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="52" cy="20" r="5" fill="#10B981" opacity="0.8" />
    <line x1="0" y1="36" x2="260" y2="36" stroke="#1F2937" stroke-width="1" />
    
    <!-- Code Lines -->
    <text x="18" y="65" font-family="monospace" font-size="11" fill="#E2E8F0">
      <tspan fill="#F43F5E">curl</tspan> -X POST \
    </text>
    <text x="18" y="85" font-family="monospace" font-size="11" fill="#38BDF8">
      "https://ntfy.sh/topic" \
    </text>
    <text x="18" y="110" font-family="monospace" font-size="11" fill="#94A3B8">
      -H <tspan fill="#A78BFA">"Title: Payment"</tspan> \
    </text>
    <text x="18" y="130" font-family="monospace" font-size="11" fill="#94A3B8">
      -H <tspan fill="#FBBF24">"Priority: high"</tspan> \
    </text>
    <text x="18" y="150" font-family="monospace" font-size="11" fill="#94A3B8">
      -H <tspan fill="#34D399">"Tags: moneybag"</tspan> \
    </text>
    <text x="18" y="175" font-family="monospace" font-size="11" fill="#64748B">
      -d <tspan fill="#F8FAFC">"Order #1042 paid"</tspan>
    </text>

    <!-- Status pill inside code card -->
    <rect x="18" y="210" width="224" height="36" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1" />
    <text x="130" y="233" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ✓ Delivered in 180ms
    </text>
  </g>
</svg>
